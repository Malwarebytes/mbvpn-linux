version: "3"

vars:
  BINARY_NAME: mbvpn

  # Debug flags
  DEBUG_GCFLAGS: -N -l

  # Release flags
  RELEASE_BUILDFLAGS: -trimpath

tasks:
  build:
    desc: Build release version (default)
    cmds:
      - task: build-release

  build-debug:
    desc: Build debug version with debug symbols
    cmds:
      - >-
        go build {{.GOFLAGS}}
        -o {{.BINARY_NAME}}
        -gcflags="{{.DEBUG_GCFLAGS}}"
        ./cmd/mbvpn

  build-release:
    desc: Build release version with optimizations
    cmds:
      - >-
        go build {{.GOFLAGS}}
        {{.RELEASE_BUILDFLAGS}}
        -o {{.BINARY_NAME}}
        ./cmd/mbvpn

  test:
    desc: Run all tests
    cmds:
      - task: test-unit
      - task: test-integration
      - task: test-e2e

  test-unit:
    desc: Run unit tests only
    cmds:
      - go test ./...

  test-integration:
    desc: Run integration tests
    deps: [build-release]
    cmds:
      - go test -tags=integration -v ./test/integration/...

  test-e2e:
    desc: Run end-to-end tests
    deps: [build-release]
    cmds:
      - go test -tags=e2e -v ./test/e2e/...
    env:
      MBVPN_TEST_LICENSE_KEY: "{{.MBVPN_TEST_LICENSE_KEY}}"

  clean:
    desc: Clean build artifacts
    cmds:
      - go clean
      - rm -f {{.BINARY_NAME}}
