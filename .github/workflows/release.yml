name: Create Release
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (format: vX.Y.Z)"
        required: true
        type: string
      is_production:
        description: "Production release"
        required: true
        default: true
        type: boolean

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      MAJOR: ${{ steps.version.outputs.MAJOR }}
      MINOR: ${{ steps.version.outputs.MINOR }}
      PATCH: ${{ steps.version.outputs.PATCH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version components
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Must be vX.Y.Z"
            exit 1
          fi
          VERSION_NUM="${VERSION#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
          echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR=$MINOR" >> $GITHUB_OUTPUT
          echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
          echo "VERSION_MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "VERSION_MINOR=$MINOR" >> $GITHUB_ENV
          echo "VERSION_PATCH=$PATCH" >> $GITHUB_ENV
          echo "VERSION_BUILD=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} \
            --title "MBVPN ${{ github.event.inputs.version }}" \
            --notes "MBVPN Release ${{ github.event.inputs.version }}"

  build-binaries:
    needs: create-release
    runs-on: [self-hosted, ubuntu-22.04-2core]
    environment: ${{ github.event.inputs.is_production == 'true' && 'prod' || 'stage' }}
    strategy:
      matrix:
        arch: [amd64, arm64, 386]
        os: [linux]
    env:
      BINARY_NAME: mbvpn-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Set version in environment
        run: |
          export VERSION_MAJOR=${{ needs.create-release.outputs.MAJOR }}
          export VERSION_MINOR=${{ needs.create-release.outputs.MINOR }}
          export VERSION_PATCH=${{ needs.create-release.outputs.PATCH }}
          export VERSION_BUILD=${{ github.run_number }}
          echo "VERSION_MAJOR=$VERSION_MAJOR" >> $GITHUB_ENV
          echo "VERSION_MINOR=$VERSION_MINOR" >> $GITHUB_ENV
          echo "VERSION_PATCH=$VERSION_PATCH" >> $GITHUB_ENV
          echo "VERSION_BUILD=$VERSION_BUILD" >> $GITHUB_ENV

      - name: Build for ${{ matrix.os }}-${{ matrix.arch }}
        env:
          MBVPN_HOLOCRON_URL: ${{ vars.MBVPN_HOLOCRON_URL }}
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} task build-release
          mv mbvpn ${{ env.BINARY_NAME }}

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.version }} ${{ env.BINARY_NAME }}
