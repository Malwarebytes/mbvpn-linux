services:
  mbvpn:
    build: .
    privileged: true
    env_file:
      - ./.env
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - .:/app
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    stdin_open: true
    tty: true
